name: Daily PDCA (metrics → strategy → articles → report)
on:
  schedule:
    - cron: '17 20 * * *'   # 05:17 JST
  workflow_dispatch:
    inputs:
      dry_run: { description: 'Mock run (no API calls, nothing published)', type: boolean, default: false }
      articles: { description: 'Override articles today (1-3, blank = strategy)', required: false }
permissions:
  contents: write
concurrency: { group: daily, cancel-in-progress: false }
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private data repo (reports, drafts, revenue CSVs, PDCA history)
        uses: actions/checkout@v4
        with:
          repository: SpiceOfLife/ours-blanc-media-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: .data
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
      - run: npm ci
      - name: Run daily pipeline
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          DAILY_BUDGET_USD: ${{ vars.DAILY_BUDGET_USD }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          ADSENSE_ACCOUNT: ${{ vars.ADSENSE_ACCOUNT }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_SITE_TAG: ${{ vars.CF_SITE_TAG }}
          ARTICLES_OVERRIDE: ${{ inputs.articles }}
          DATA_DIR: .data
        run: node pipeline/run-daily.mjs
      - name: Verify site still builds
        run: npm run build
      - name: Push private data (reports, drafts, history)
        if: ${{ !inputs.dry_run }}
        working-directory: .data
        run: |
          git config user.name "ours-blanc-bot"; git config user.email "support@ours-blanc.app"
          git add -A
          git diff --cached --quiet || { git commit -m "daily: $(TZ=Asia/Tokyo date +%F) report"; git push; }
      - name: Commit & push site content (Cloudflare deploys on push)
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "ours-blanc-bot"; git config user.email "support@ours-blanc.app"
          git add src/content/posts public/eyecatch config
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "daily: $(TZ=Asia/Tokyo date +%F) articles"
          git push
